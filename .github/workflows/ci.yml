name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # Every uv command in this job must use the matrix interpreter. Without
      # this, `uv run` falls back to .python-version (3.11) and rebuilds the
      # environment, so the matrix silently tested 3.11 three times.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system tools the scan tests need
        # poppler rasterizes the PDF sheets. The GL/glib libs are what
        # OpenCV's wheel links against on some images.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The decode group pulls in OpenCV, which tests/test_roundtrip.py uses
        # to scan the generated codes back with something other than our code.
        run: uv sync --group decode

      - name: Lint
        run: uv run --group decode ruff check .

      - name: Test
        # QRC_REQUIRE_DECODE turns every skip in tests/test_roundtrip.py into
        # a failure. Those are the only tests that check a code actually
        # scans, and a silent skip there looks just like a green run.
        env:
          QRC_REQUIRE_DECODE: "1"
        run: |
          uv run --group decode python -c "import sys, cv2; print(sys.version, cv2.__version__)"
          uv run --group decode pytest -q -rs
