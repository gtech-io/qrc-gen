name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system tools the scan tests need
        # poppler rasterizes the PDF sheets; the GL/glib libs are what
        # OpenCV's wheel links against, without which `import cv2` fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # The decode group pulls in OpenCV, which tests/test_roundtrip.py uses
        # to scan the generated codes back with something other than our code.
        run: uv sync --group decode --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # QRC_REQUIRE_DECODE turns every skip in tests/test_roundtrip.py into
        # a failure. Those are the only tests that check a code actually
        # scans, and a silent skip there looks just like a green run.
        env:
          QRC_REQUIRE_DECODE: "1"
        run: uv run pytest -q -rs
